<h1>HoraxHora</h1>

<h2>Conteo actual</h2>
<p>Buenas: {{ buenas }}</p>
<p>Malas: {{ malas }}</p>

<h2>Registrar unidades</h2>

<h3>Total de registros: {{ historial.length }}</h3>

<h2>Historial de registros</h2>

<h3>Filtrar por fechas</h3>

<input type="date" [(ngModel)]="fechaInicio">
<input type="date" [(ngModel)]="fechaFin">

<button (click)="filtrarHistorial()">Filtrar</button>

<table border="1">
  <tr>
    <th>ID</th>
    <th>Tipo</th>
    <th>Fecha</th>
  </tr>

  <tr *ngFor="let item of historial">
    <td>{{ item.id }}</td>
    <td>{{ item.tipo }}</td>
    <td>{{ item.fecha }}</td>
  </tr>
</table>

<button (click)="registrar('BUENA')">Registrar Buena</button>
<button (click)="registrar('MALA')">Registrar Mala</button>
